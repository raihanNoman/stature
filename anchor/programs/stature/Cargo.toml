[package]
name = "stature"
version = "0.1.0"
description = "A simple SOL stature program"
edition = "2021"


[lib]
crate-type = ["cdylib", "lib"]
name = "stature"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
custom-heap = []
custom-panic = []
anchor-debug = []

[dependencies]
anchor-lang = { version = "0.32.1", features = ["init-if-needed"] }


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(target_os, values("solana"))',
    'cfg(feature, values("anchor-debug", "custom-heap", "custom-panic"))'
] }



[dev-dependencies]
litesvm = "=0.7.1"
solana-sdk = "2.3"
solana-system-interface = "2.0.0"

